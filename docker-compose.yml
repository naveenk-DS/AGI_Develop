# ─────────────────────────────────────────────────────────────────
#  NAVIX AGI — Docker Compose
#  Services: navix (main app) + qdrant (vector DB) + ollama (LLM)
# ─────────────────────────────────────────────────────────────────

services:

  # ── Main NAVIX AGI Application ───────────────────────────────────
  navix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navix_agi
    restart: unless-stopped
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      # Persist logs and screenshots on host
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./data:/app/data
      # Mount UI folder for instant updates without rebuilding
      - ./navix_hud_ui:/app/navix_hud_ui
    depends_on:
      - qdrant
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - navix_net

  # ── Qdrant Vector Database ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: navix_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - navix_net

  # ── Ollama Local LLM ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: navix_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - navix_net

# ── Named Volumes (data survives container restarts) ──────────────
volumes:
  qdrant_data:
  ollama_models:

# ── Network ───────────────────────────────────────────────────────
networks:
  navix_net:
    driver: bridge
